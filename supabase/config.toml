# Supabase CLI configuration.
# `supabase link --project-ref <ref>` then `supabase db push` applies
# supabase/migrations to the linked project. See docs/M2-SETUP.md.

project_id = "gymapp"

[api]
enabled = true
port = 54321
# Gym App lives in `gymapp`, not `public` — the hosted project's public schema
# belongs to other apps. The hosted equivalent of this line is
# Dashboard → Settings → API → Exposed schemas.
schemas = ["public", "gymapp"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Matches the hosted project (Postgres 17.6).
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Overridden per environment; the hosted project's value is set in the
# dashboard under Authentication → URL Configuration.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Google OAuth. Secrets come from the environment, never from this file.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
